name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check UTF-8
        run: npm run check:utf8

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
